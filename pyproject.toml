[project]
name = "yet-another-agentic-chat"
version = "0.1.0"
description = "YAAC: Yet Another Agentic Chat. A zero-infrastructure MCP messaging between concurrent agentic sessions."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Alex Myodov", email = "amyodov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyzmq>=26",
    "mcp>=1.2",
]

[project.scripts]
yaac = "yaac.frontend:main"

[project.urls]
Homepage = "https://github.com/amyodov/yet-another-agentic-chat"

[dependency-groups]
dev = [
    "pytest>=8",
    # >=1.4 for the pytest_asyncio_loop_factories hook, which conftest.py uses to pick loop flavors on Windows.
    "pytest-asyncio>=1.4",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yaac"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
