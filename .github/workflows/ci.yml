# The Windows job is load-bearing: nobody on the project has Windows hardware, so this matrix is where the
# selector-loop and bind-election facts in CLAUDE.md graduate from source-verified to measured.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # --all-extras so the terminal client's tests run too. Without it they are skipped, and a client nobody
      # exercises on Windows is exactly the kind of thing this matrix exists to catch.
      - run: uv sync --frozen --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q
